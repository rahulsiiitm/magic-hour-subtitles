[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-hour-subtitles"
version = "0.1.0"
description = "Scene-aware dynamic subtitle generator for video"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "click",
    "faster-whisper",
    "Pillow",
    "rich",
    "imageio-ffmpeg",
    "static-ffmpeg",
    "numpy",
    "opencv-python-headless",
    "ultralytics",
]

[project.scripts]
magic-hour-subtitles = "magic_hour_subtitles.cli:main"

[tool.setuptools.packages.find]
include = ["magic_hour_subtitles*"]

[tool.setuptools.package-data]
"magic_hour_subtitles.fonts" = ["*.ttf", "*.txt"]
